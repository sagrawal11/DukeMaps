<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DukeMaps</title>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      #app { position: absolute; inset: 0; }
      .legend {
        position: absolute; top: 10px; right: 10px; max-width: 260px; background: #fff;
        padding: 10px 12px; font: 13px/1.4 system-ui, sans-serif; border-radius: 6px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2); z-index: 1;
      }
      .legend code { background: #f4f4f4; padding: 0 3px; border-radius: 3px; }
      .panel {
        position: absolute; top: 10px; left: 10px; width: 300px; max-width: calc(100vw - 20px);
        background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
        padding: 12px; font: 14px/1.4 system-ui, sans-serif; z-index: 2;
      }
      .panel .brand { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
      .panel .field { position: relative; margin-bottom: 8px; }
      .panel input {
        width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d0d5dd;
        border-radius: 8px; font: inherit;
      }
      .panel input:focus { outline: 2px solid #2e6fd6; border-color: #2e6fd6; }
      .ac {
        position: absolute; left: 0; right: 0; top: calc(100% + 2px); background: #fff;
        border: 1px solid #e4e7ec; border-radius: 8px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
        max-height: 240px; overflow: auto; display: none; z-index: 3;
      }
      .ac .hit {
        display: block; width: 100%; text-align: left; border: 0; background: none;
        padding: 8px 10px; font: inherit; cursor: pointer;
      }
      .ac .hit:hover { background: #f2f6fc; }
      .info { margin-top: 4px; color: #344054; font-size: 13px; }
      .info .dim { color: #98a2b3; }
      .info .ready { color: #2e9e5b; }
      .anim-overlay { position: absolute; inset: 0; pointer-events: none; }
      .show { margin-top: 8px; border-top: 1px solid #eef0f4; padding-top: 8px; }
      .show[hidden] { display: none; }
      .caption { font-size: 12.5px; color: #475467; margin-bottom: 7px; }
      .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
      .controls button {
        border: 1px solid #d0d5dd; background: #f8fafc; border-radius: 7px; padding: 5px 9px;
        font: inherit; font-size: 12.5px; cursor: pointer;
      }
      .controls button:hover { background: #eef2f7; }
      .controls .spd { font-size: 12px; color: #475467; display: flex; align-items: center; gap: 4px; }
      .controls input[type='range'] { width: 90px; }
      .stats { font-size: 12.5px; color: #344054; }
      .stats b { color: #101828; }
      .result { margin-top: 5px; font-size: 14px; color: #1b5e20; }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
      .chips .chip {
        border: 1px solid #d0d5dd; background: #fff; border-radius: 999px; padding: 3px 9px;
        font: inherit; font-size: 11.5px; color: #475467; cursor: pointer;
      }
      .chips .chip:hover { background: #f2f6fc; }
      .chips .chip.on { background: #2e6fd6; border-color: #2e6fd6; color: #fff; }
      .compare { margin-top: 7px; }
      .compare table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .compare th { color: #98a2b3; font-weight: 600; padding: 2px 0; text-align: left; }
      .compare td { padding: 2px 0; color: #344054; }
      .compare th:nth-child(n + 2), .compare td:nth-child(n + 2) { text-align: right; }
      .compare .dim { color: #98a2b3; font-size: 11px; margin-top: 2px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
