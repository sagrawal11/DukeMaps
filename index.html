<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DukeMaps</title>
    <meta name="description" content="Walking directions across Duke's campus — watch the search algorithms behind Google Maps explore the map." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
    />
    <style>
      /* ── Editorial-light design system ─────────────────────────────────────────
         Paper chrome, ink text, one quiet accent; the map and its coloured exploration
         stay the heroes. Overlay/viz colours live in src/map/overlay.ts and are untouched. */
      :root {
        --paper: #fcfcfa;
        --paper-2: #ffffff;
        --ink: #1a1817;
        --muted: #6b7280;
        --faint: #9aa1ab;
        --line: #e9e7e1;
        --line-2: #f1efe9;
        --accent: #0b7285;
        --accent-ink: #0a5f70;
        --ok: #1b7a37;
        --radius: 14px;
        --radius-sm: 9px;
        --radius-pill: 999px;
        --shadow: 0 8px 30px rgba(26, 24, 23, 0.13), 0 1px 3px rgba(26, 24, 23, 0.07);
        --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      }
      html, body, #app { height: 100%; margin: 0; }
      #app { position: absolute; inset: 0; }
      body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

      /* Loading / status box (removed once the panel takes over) */
      .legend {
        position: absolute; top: 16px; right: 16px; max-width: 260px; background: var(--paper);
        padding: 12px 14px; font: 13px/1.45 var(--sans); color: var(--ink);
        border: 1px solid var(--line); border-radius: var(--radius-sm);
        box-shadow: var(--shadow); z-index: 1;
      }
      .legend code { background: var(--line-2); padding: 1px 4px; border-radius: 4px; font-size: 12px; }

      /* ── The panel ───────────────────────────────────────────────────────────── */
      .panel {
        position: absolute; top: 16px; left: 16px; width: 336px; max-width: calc(100vw - 32px);
        max-height: calc(100vh - 32px); overflow: auto; background: var(--paper);
        border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
        padding: 18px; font: 14px/1.5 var(--sans); color: var(--ink); z-index: 2;
      }
      @media (prefers-reduced-motion: no-preference) {
        .panel { animation: rise 0.38s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      }
      .sheet-handle { display: none; }

      .panel .brand {
        font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 1;
        letter-spacing: -0.015em; color: var(--ink); margin: 2px 0 14px;
      }

      /* Search fields */
      .panel .field { position: relative; margin-bottom: 9px; }
      .panel .field input {
        width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line);
        border-radius: var(--radius-sm); font: 14px var(--sans); color: var(--ink); background: var(--paper-2);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .panel .field input::placeholder { color: var(--faint); }
      .panel .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11, 114, 133, 0.14); }

      /* Autocomplete */
      .ac {
        position: absolute; left: 0; right: 0; top: calc(100% + 3px); background: var(--paper-2);
        border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow);
        max-height: 244px; overflow: auto; display: none; z-index: 3;
      }
      .ac .hit {
        display: block; width: 100%; text-align: left; border: 0; background: none;
        padding: 9px 12px; font: 14px var(--sans); color: var(--ink); cursor: pointer;
      }
      .ac .hit:hover { background: var(--line-2); }

      /* Options row */
      .disclosure {
        border: 0; background: none; padding: 5px 0; margin: 6px 0 2px; font: 12.5px var(--sans);
        color: var(--accent-ink); cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
      }
      .disclosure::after { content: '▾'; font-size: 9px; transition: transform 0.15s; }
      .disclosure.open::after { transform: rotate(180deg); }
      .options { display: flex; flex-direction: column; gap: 10px; margin: 2px 0 8px; }
      .options[hidden], .compare[hidden] { display: none; }
      .leave-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-pill); overflow: hidden; }
      .seg-btn { border: 0; background: var(--paper-2); padding: 6px 13px; font: 12px var(--sans); color: var(--muted); cursor: pointer; }
      .seg-btn:hover { background: var(--line-2); }
      .seg-btn.on { background: var(--accent); color: #fff; }
      .leave-row input[type='time'] {
        padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm);
        font: 12.5px var(--sans); color: var(--ink); background: var(--paper-2);
      }
      .opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .controls .ctl-link { border: 0; background: none; color: var(--muted); padding: 5px 2px; margin-left: auto; }
      .controls .ctl-link:hover { background: none; color: var(--ink); }
      .opt {
        border: 1px solid var(--line); background: var(--paper-2); border-radius: var(--radius-pill);
        padding: 5px 12px; font: 12px var(--sans); color: var(--muted); cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .opt:hover { border-color: #d8d5cc; background: var(--line-2); }
      .opt.on { background: var(--accent); border-color: var(--accent); color: #fff; }

      .metric { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; min-height: 1em; line-height: 1.4; }
      .metric b { color: var(--accent-ink); font-weight: 600; }
      .metric .dim { color: var(--faint); }

      .info { margin-top: 8px; color: var(--ink); font-size: 13px; }
      .info b { font-weight: 600; }
      .info .dim { color: var(--faint); }
      .info .ready { color: var(--ok); }
      .info .notice { color: #b45309; font-weight: 500; }

      .anim-overlay { position: absolute; inset: 0; pointer-events: none; }

      /* ── The show ────────────────────────────────────────────────────────────── */
      .show { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
      .show[hidden] { display: none; }

      .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
      .chips .chip {
        border: 1px solid var(--line); background: var(--paper-2); border-radius: var(--radius-pill);
        padding: 4px 10px; font: 11.5px var(--sans); color: var(--muted); cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .chips .chip:hover { background: var(--line-2); }
      .chips .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
      .chips .chip.disabled, .chips .chip:disabled { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }

      .chipnote { font-size: 11px; color: var(--faint); margin: 2px 0 8px; line-height: 1.4; }
      .chipnote:empty { display: none; }

      .caption { font-size: 13px; line-height: 1.5; color: var(--muted); margin-bottom: 10px; }

      .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
      .controls button {
        border: 1px solid var(--line); background: var(--paper-2); border-radius: var(--radius-sm);
        padding: 6px 11px; font: 12.5px var(--sans); color: var(--ink); cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .controls button:hover { background: var(--line-2); border-color: #d8d5cc; }
      .controls .spd { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
      .controls input[type='range'] { width: 92px; accent-color: var(--accent); }

      .stats { font-size: 12.5px; color: var(--muted); }
      .stats b { color: var(--ink); font-weight: 600; }

      .result { margin-top: 8px; font-size: 15px; color: var(--ink); }
      .result b { font-family: var(--serif); font-weight: 600; font-size: 17px; }

      .whatif {
        margin-top: 10px; font-size: 12.5px; line-height: 1.5; color: var(--muted);
        background: var(--line-2); border-radius: var(--radius-sm); padding: 8px 10px;
      }
      .whatif:empty { display: none; }
      .whatif b { color: var(--ink); font-weight: 600; }

      /* Comparison table */
      .compare { margin-top: 12px; }
      .compare table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .compare th { color: var(--faint); font-weight: 600; padding: 3px 0; text-align: left; border-bottom: 1px solid var(--line); }
      .compare td { padding: 4px 0; color: var(--ink); border-bottom: 1px solid var(--line-2); }
      .compare tr:last-child td { border-bottom: 0; }
      .compare th:nth-child(n + 2), .compare td:nth-child(n + 2) { text-align: right; }
      .compare .dim { color: var(--faint); font-size: 11px; margin-top: 4px; }

      .show.instant .chips, .show.instant .caption, .show.instant .controls, .show.instant .stats, .show.instant .compare, .show.instant .disclosure { display: none; }

      /* ── Elimination-tree inset (CH/CCH only) ──────────────────────────────────────
         Rank is a non-spatial axis the map can't show, so the hierarchy gets its own little
         panel: y = depth, apex at the top, From/To at the bottom. SVG (tens of nodes). */
      .elim-inset {
        position: absolute; right: 16px; bottom: 16px; width: 232px; background: var(--paper);
        border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
        padding: 12px 14px 10px; z-index: 1; pointer-events: none;
      }
      .elim-inset[hidden] { display: none; }
      @media (prefers-reduced-motion: no-preference) {
        .elim-inset { animation: rise 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
      }
      .elim-title {
        font-family: var(--serif); font-weight: 600; font-size: 13px; color: var(--ink);
        letter-spacing: -0.01em; margin-bottom: 6px;
      }
      .elim-svg { display: block; width: 100%; height: auto; overflow: visible; }
      .elim-label { font: 600 7px var(--sans); }
      .elim-apex.pulse { transform-box: fill-box; transform-origin: center; animation: elim-pulse 1.1s ease-in-out infinite; }
      @keyframes elim-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.55); } }
      .elim-cap { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.35; min-height: 2.7em; }

      /* ── Clickable building icons: white circular badges floating over the map ───── */
      /* The circle is the marker's layout box (the label is absolute, out of flow) so MapLibre's
         'center' anchor centers the CIRCLE exactly on the building — the label just hangs below it. */
      .bicon {
        position: relative; border: 0; background: none; padding: 0; cursor: pointer;
        display: block; line-height: 0;
      }
      .bicon-circle {
        width: 40px; height: 40px; border-radius: 50%; background: #fff; overflow: hidden;
        display: flex; align-items: center; justify-content: center; /* centers the art in the circle */
        box-shadow: 0 2px 6px rgba(26, 24, 23, 0.28), 0 0 0 1px rgba(26, 24, 23, 0.06);
        transition: transform 0.12s ease;
      }
      .bicon-circle img { width: 78%; height: 78%; object-fit: contain; pointer-events: none; display: block; }
      .bicon-label {
        position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 3px;
        font: 600 10px/1.1 var(--sans); color: var(--ink); white-space: nowrap; pointer-events: none;
        text-align: center; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
        text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; /* legible over the map */
      }
      /* Importance → size: landmarks bigger, minor buildings smaller + muted. */
      .bicon-t1 .bicon-circle { width: 48px; height: 48px; }
      .bicon-t1 .bicon-label { font-size: 11px; }
      .bicon-t3 .bicon-circle { width: 34px; height: 34px; }
      .bicon-t3 .bicon-label { font-size: 9px; color: var(--muted); }
      .bicon:hover { z-index: 5; }
      .bicon:hover .bicon-circle { transform: scale(1.15); }
      .bicon:focus-visible .bicon-circle { outline: 2px solid var(--accent); outline-offset: 2px; }
      .bicon-hidden { display: none; }

      /* ── Mobile: the panel becomes a bottom sheet ──────────────────────────────── */
      @media (max-width: 640px) {
        .panel {
          top: auto; bottom: 0; left: 0; right: 0; width: auto; max-width: none;
          border-radius: 20px 20px 0 0; border-left: 0; border-right: 0; border-bottom: 0;
          max-height: 76vh; padding: 6px 18px calc(18px + env(safe-area-inset-bottom));
          box-shadow: 0 -8px 30px rgba(26, 24, 23, 0.16);
        }
        @media (prefers-reduced-motion: no-preference) {
          @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        }
        .sheet-handle {
          display: block; width: 100%; border: 0; background: none; padding: 8px 0 6px; cursor: pointer;
          position: sticky; top: 0;
        }
        .sheet-handle::before {
          content: ''; display: block; width: 38px; height: 4px; border-radius: var(--radius-pill);
          background: #d8d5cc; margin: 0 auto;
        }
        .panel .brand { font-size: 21px; margin: 2px 0 12px; }
        .panel.collapsed { overflow: hidden; }
        .panel.collapsed .info, .panel.collapsed .metric, .panel.collapsed .options, .panel.collapsed .show { display: none; }
        .legend { top: 12px; right: 12px; left: 12px; max-width: none; }
        /* The bottom sheet owns the bottom; the inset moves to the clear top-left corner. */
        .elim-inset { right: auto; left: 12px; top: 12px; bottom: auto; width: 142px; padding: 9px 10px 7px; }
        .elim-title { font-size: 11.5px; }
        .elim-cap { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
